
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffe5ee">
<title>Para Leontina 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: #672b43;
  background: linear-gradient(145deg, #fff0f5, #ffd6e5, #fce4ec);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 14px;
  overflow-x: hidden;
}

.fundo-coracoes {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.coracao-flutuante {
  position: absolute;
  bottom: -40px;
  animation: subir linear forwards;
  opacity: 0.65;
}

@keyframes subir {
  to {
    transform: translateY(-115vh) rotate(35deg);
    opacity: 0;
  }
}

.cartao {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 430px;
  padding: 32px 23px;
  text-align: center;
  border: 1px solid #ffffff;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.91);
  box-shadow: 0 18px 55px rgba(150, 45, 85, 0.16);
  animation: aparecer 1s ease;
}

@keyframes aparecer {
